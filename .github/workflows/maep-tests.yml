name: MAEP tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: MAEP unit tests
        run: python -m unittest discover -s maep/tests -v
      - name: Agent guard hook tests
        run: python -m unittest discover -s .claude/hooks -p "test_*.py" -v
