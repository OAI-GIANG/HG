name: rt06-trust-anchor-tests
on:
  push:
    branches: [rt06/trust-anchor-provider-20261023]
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install --quiet pytest
      - name: run RT-06 tests
        run: python -m pytest maep/tests/test_trust_anchor.py -q
