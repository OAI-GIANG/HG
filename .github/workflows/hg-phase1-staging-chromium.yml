name: HG phase 1 staging Chromium

on:
  push:
    branches:
      - stt/hg-phase1-staging-20261124
    paths:
      - .github/workflows/hg-phase1-staging-chromium.yml

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 40254e60802bc59e40cd739d6ae4081241af4acd
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Chromium test dependencies
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Run repository browser checks on the accepted candidate
        run: |
          test "$(git rev-parse HEAD)" = 40254e60802bc59e40cd739d6ae4081241af4acd
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree}
          python -m hg.tests.ui_browser_e2e "$RUNNER_TEMP/hg-browser"
          python - "$RUNNER_TEMP/hg-browser/ui-e2e-report.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          checks = json.loads(Path(sys.argv[1]).read_text())["checks"]
          print(f"Chromium: {sum(item['ok'] for item in checks.values())}/{len(checks)} PASS")
          assert checks and all(item["ok"] for item in checks.values())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hg-phase1-chromium-40254e6
          path: ${{ runner.temp }}/hg-browser
